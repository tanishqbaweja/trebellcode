name: Publish Trebell Code Desktop v0.5.0
# Re-run after Windows child-process cleanup fix.

on:
  push:
    paths:
      - ".github/workflows/desktop-release-v0.5.0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: trebell-code

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Trebell tests including real Codex relay
        run: npm test

      - name: Build Freebuff bridge and GUI
        run: |
          npm run bridge:build
          npm run ui:build

      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Verify bundled Codex harness
        shell: pwsh
        run: |
          $codex = Get-ChildItem -Path "desktop-dist\win-unpacked\resources\app.asar.unpacked\node_modules\@openai\codex-win32-x64" -Filter codex.exe -Recurse | Select-Object -First 1
          if (-not $codex) { throw "Bundled Codex harness binary was not found." }
          & $codex.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Codex harness failed to execute." }

      - name: Install generated Trebell Code installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "desktop-dist" -Filter "Trebell-Code-Setup-0.5.0.exe" | Select-Object -First 1
          if (-not $installer) { throw "Trebell Code installer was not generated." }
          $proc = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Installer exited with code $($proc.ExitCode)" }

      - name: Launch installed desktop app
        shell: pwsh
        run: |
          $installed = Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Filter "Trebell Code.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installed) { throw "Installed Trebell Code executable was not found." }

          $env:TREBELL_GUI_PORT = "3210"
          $env:TREBELL_APP_SERVER_PORT = "23456"
          $env:TREBELL_GUI_DEBUG = "1"

          $app = Start-Process -FilePath $installed.FullName -PassThru
          $app.Id | Set-Content "$env:RUNNER_TEMP\trebell-installed.pid"

          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              $boot = Invoke-RestMethod -Uri "http://127.0.0.1:3210/api/bootstrap" -TimeoutSec 2
              if ($boot.appServerReady -eq $true -and $boot.version -eq "0.5.0") {
                $ok = $true
                break
              }
            } catch {}
          }
          if (-not $ok) { throw "Installed Trebell Code never reached app-server ready state." }

      - name: Verify installed browser relay and command execution
        run: node tests/installed-relay-check.mjs http://127.0.0.1:3210

      - name: Verify installed runtime and workspace APIs
        shell: pwsh
        run: |
          $runtime = Invoke-RestMethod -Uri "http://127.0.0.1:3210/api/runtime" -TimeoutSec 3
          if ($runtime.appServerReady -ne $true) { throw "Installed runtime reports Codex app-server not ready." }

          $tree = Invoke-RestMethod -Uri "http://127.0.0.1:3210/api/workspace/tree" -TimeoutSec 5
          if ($null -eq $tree.entries) { throw "Workspace tree endpoint is unavailable." }

          $health = Invoke-RestMethod -Uri "http://127.0.0.1:3210/api/health" -TimeoutSec 3
          if ($health.ok -ne $true) { throw "Trebell GUI health check failed." }

      - name: Stop installed application
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:RUNNER_TEMP\trebell-installed.pid") {
            $pidValue = Get-Content "$env:RUNNER_TEMP\trebell-installed.pid" | Select-Object -First 1
            Stop-Process -Id $pidValue -Force -ErrorAction SilentlyContinue
          }
          Get-Process codex -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Create checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "desktop-dist" -Filter "Trebell-Code-Setup-0.5.0.exe" | Select-Object -First 1
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content -Path "desktop-dist\Trebell-Code-Setup-0.5.0.exe.sha256" -Encoding ascii
          Write-Host "SHA256: $hash"

      - name: Write release notes
        shell: pwsh
        run: |
          @'
          ## Trebell Code Desktop v0.5.0

          This release fixes the broken desktop harness connection in v0.4.0 and replaces the major static frontend placeholders with working local features.

          ### Critical connection fix
          Codex app-server intentionally rejects WebSocket upgrade requests carrying a browser `Origin` header. The Electron renderer was previously connecting directly to Codex, so the connection could never be reliable.

          v0.5.0 routes renderer WebSockets through Trebell's localhost backend. The backend opens the Codex connection without a browser Origin header and relays JSON-RPC bidirectionally.

          ### Functional frontend
          - Real Codex thread listing and resume
          - Real saved conversation hydration
          - New thread creation
          - Thread rename and archive
          - Real turn start / streaming / interrupt
          - Command and file approval requests
          - Request-user-input handling
          - Real manual terminal via Codex `command/exec`
          - Real project folder picker
          - Real attachment picker
          - Real workspace file tree and file preview
          - Real Git status/diff view
          - Functional template prompts
          - Functional history page
          - Share copies the actual conversation
          - Web-search preference influences new thread instructions
          - Dead microphone control is disabled instead of pretending to work
          - Runtime status reports real Codex and Freebuff bridge readiness
          - Freebuff account / Freebucks / pricing / session UI from v0.4.0 remains

          ### Freebuff fallback
          If Codex app-server is temporarily unavailable, ordinary text prompts use a direct local freebuff2api chat path rather than returning "App-server is not connected". Agentic file/shell/tool operations still require the Codex harness.

          ### Validation
          CI now includes a regression test that launches a real Codex app-server, connects with a browser-style Origin header through the Trebell relay, initializes JSON-RPC, lists threads, and executes a real command.

          The Windows release workflow then:
          - builds the NSIS installer,
          - installs it on a clean Windows runner,
          - launches the installed Trebell Code.exe,
          - waits for the bundled Codex app-server to become ready,
          - connects through the installed Trebell WebSocket relay,
          - initializes Codex,
          - lists threads,
          - runs a real command through `command/exec`,
          - validates runtime, workspace, and health endpoints.

          Live Freebuff inference requires an authenticated Freebuff account and is not exercised with private account credentials in public CI.

          This installer is currently unsigned, so Windows SmartScreen may display an Unknown publisher warning.
          '@ | Set-Content -Path "desktop-dist\release-notes-v0.5.0.md" -Encoding utf8

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          $installer = Resolve-Path "trebell-code\desktop-dist\Trebell-Code-Setup-0.5.0.exe"
          $checksum = Resolve-Path "trebell-code\desktop-dist\Trebell-Code-Setup-0.5.0.exe.sha256"
          $notes = Resolve-Path "trebell-code\desktop-dist\release-notes-v0.5.0.md"

          if (gh release view v0.5.0 *> $null) {
            gh release upload v0.5.0 $installer $checksum --clobber
          } else {
            gh release create v0.5.0 $installer $checksum --target "$env:GITHUB_SHA" --title "Trebell Code Desktop v0.5.0" --notes-file $notes
          }

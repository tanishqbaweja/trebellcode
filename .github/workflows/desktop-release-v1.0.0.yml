name: Publish Trebell Code Desktop v1.0.0

on:
  push:
    paths:
      - "release-trigger-v1.0.0.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: trebell-code

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify package version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne "1.0.0") { throw "Expected package version 1.0.0, got $($pkg.version)" }

      - name: Install dependencies
        shell: pwsh
        run: |
          $attempts = 3
          for ($i = 1; $i -le $attempts; $i++) {
            Write-Host "npm install attempt $i/$attempts"
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq $attempts) { throw "npm install failed after $attempts attempts." }
            Start-Sleep -Seconds (5 * $i)
          }

      - name: Run full Trebell harness tests
        run: npm test

      - name: Build Freebuff bridge and Trebell UI
        run: |
          npm run bridge:build
          npm run ui:build

      - name: Build Windows NSIS installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Verify bundled Codex harness
        shell: pwsh
        run: |
          $codex = Get-ChildItem -Path "desktop-dist\win-unpacked\resources\app.asar.unpacked\node_modules\@openai\codex-win32-x64" -Filter codex.exe -Recurse | Select-Object -First 1
          if (-not $codex) { throw "Bundled Codex harness binary was not found." }
          & $codex.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Codex harness failed to execute." }

      - name: Install generated Trebell Code
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "desktop-dist" -Filter "Trebell-Code-Setup-1.0.0.exe" | Select-Object -First 1
          if (-not $installer) { throw "Trebell Code installer was not generated." }
          $proc = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Installer exited with code $($proc.ExitCode)" }

      - name: Launch and validate installed desktop application
        shell: pwsh
        run: |
          $installed = Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Filter "Trebell Code.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installed) { throw "Installed Trebell Code executable was not found." }

          $env:TREBELL_GUI_PORT = "3210"
          $env:TREBELL_APP_SERVER_PORT = "23456"
          $env:TREBELL_GUI_DEBUG = "1"
          $env:TREBELL_CDP_URL = "http://127.0.0.1:9333"

          $stdout = "$env:RUNNER_TEMP\trebell-installed.stdout.log"
          $stderr = "$env:RUNNER_TEMP\trebell-installed.stderr.log"
          $app = Start-Process -FilePath $installed.FullName -ArgumentList "--remote-debugging-port=9333" -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $app.Id | Set-Content "$env:RUNNER_TEMP\trebell-installed.pid"

          try {
            $ready = $false
            $lastBoot = $null
            for ($i = 0; $i -lt 160; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $boot = Invoke-RestMethod -Uri "http://127.0.0.1:3210/api/bootstrap" -TimeoutSec 2
                $lastBoot = $boot
                if ($boot.appServerReady -eq $true -and $boot.version -eq "1.0.0") {
                  $ready = $true
                  break
                }
              } catch {}
              if ($app.HasExited) { break }
            }

            if (-not $ready) {
              if ($lastBoot) { Write-Host "Last bootstrap: $($lastBoot | ConvertTo-Json -Depth 8 -Compress)" }
              throw "Installed Trebell Code never reached the expected ready state."
            }

            node tests/installed-relay-check.mjs http://127.0.0.1:3210
            if ($LASTEXITCODE -ne 0) { throw "Installed relay validation failed." }

            $payload = @{ name = "Release validation"; cols = 100; rows = 24 } | ConvertTo-Json
            $session = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:3210/api/terminal/sessions" -ContentType "application/json" -Body $payload -TimeoutSec 10
            if (-not $session.session.id -or $session.session.running -ne $true) { throw "PTY terminal did not start." }
            Invoke-RestMethod -Method Delete -Uri ("http://127.0.0.1:3210/api/terminal/sessions?id=" + [uri]::EscapeDataString($session.session.id)) -TimeoutSec 10 | Out-Null

            $runtime = Invoke-RestMethod -Uri "http://127.0.0.1:3210/api/runtime" -TimeoutSec 3
            if ($runtime.appServerReady -ne $true) { throw "Codex app-server is not ready." }

            $diagnostics = Invoke-RestMethod -Uri "http://127.0.0.1:3210/api/diagnostics" -TimeoutSec 5
            if ($diagnostics.version -ne "1.0.0") { throw "Diagnostics returned the wrong version: $($diagnostics.version)" }

            $health = Invoke-RestMethod -Uri "http://127.0.0.1:3210/api/health" -TimeoutSec 3
            if ($health.ok -ne $true) { throw "Trebell GUI health check failed." }

            node tests/installed-desktop-check.mjs
            if ($LASTEXITCODE -ne 0) { throw "Installed desktop/browser validation failed." }
          } catch {
            Write-Host "Installed process exited: $($app.HasExited)"
            if (Test-Path $stdout) { Write-Host "--- Trebell stdout ---"; Get-Content $stdout -Tail 300 }
            if (Test-Path $stderr) { Write-Host "--- Trebell stderr ---"; Get-Content $stderr -Tail 300 }
            throw
          }

      - name: Stop installed application
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:RUNNER_TEMP\trebell-installed.pid") {
            $pidValue = Get-Content "$env:RUNNER_TEMP\trebell-installed.pid" | Select-Object -First 1
            Stop-Process -Id $pidValue -Force -ErrorAction SilentlyContinue
          }
          Get-Process codex -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process "Trebell Code" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Create installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "desktop-dist" -Filter "Trebell-Code-Setup-1.0.0.exe" | Select-Object -First 1
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content -Path "desktop-dist\Trebell-Code-Setup-1.0.0.exe.sha256" -Encoding ascii
          Write-Host "SHA256: $hash"

      - name: Write release notes
        shell: pwsh
        run: |
          @'
          ## Trebell Code Desktop v1.0.0

          Trebell Code 1.0 turns the Codex-backed desktop runtime into a provider-agnostic agentic coding workbench with a calmer T3-inspired control surface.

          ### Agent harness and browser use
          - Codex remains the local harness for threads, turns, shell, files, diffs, approvals, checkpoints, worktrees, MCP and orchestration
          - the isolated Trebell agent browser is model-callable through dynamic tools for open, snapshot, click, type and screenshot
          - browser element annotations, screenshots and cookie import become normal agent context
          - new desktop Snap Shot capture attaches the primary display as explicit image context without granting silent global mouse/keyboard control
          - real PTY terminals, workspace editing, Git/PR workflows, delegated-agent activity and remote control remain integrated

          ### Selectable inference providers
          - Freebuff, AgentRouter, JustWorker.icu, HCNSec.cn and VyceAi
          - AgentRouter exposes its supported catalog before authentication
          - JustWorker uses its documented Anthropic-compatible messages transport
          - HCNSec and other chat-only providers route through Trebell's Responses compatibility bridge
          - VyceAi uses authenticated model discovery and OpenAI-compatible chat transport
          - Trebell Remote now follows the selected provider instead of silently forcing Freebuff
          - runtime User-Agent identity is derived from the package version

          ### Live external-model validation
          - a temporary isolated Railway validation used VyceAi deepseek-v4.1
          - the model successfully executed Trebell-compatible browser tool calls in sequence: open -> snapshot -> click -> snapshot
          - the revealed browser value was returned only after the tool-result round trip
          - public CI still keeps provider credentials out of the repository and release artifacts

          ### v1 interface
          - simplified thread-first sidebar with less permanent chrome
          - aligned workspace/right-panel hierarchy
          - denser, calmer conversation and composer layout
          - provider configuration is consolidated instead of permanently occupying navigation space
          - Browser, Files, Diff, Git, Agents and Runtime remain contextual surfaces rather than dashboard clutter

          ### Release validation
          - full Node harness tests and Responses bridge tests
          - Chromium UI E2E
          - exact Windows installer build, silent install and launch
          - bundled Codex app-server startup
          - real PTY validation
          - isolated agent-browser navigation/snapshot/type/click/screenshot and cookie import
          - desktop Snap Shot PNG capture through the packaged Electron preload/IPC path
          - provider-switch compatibility against the bundled Codex binary
          - SHA-256 installer checksum

          This build is unsigned, so Windows SmartScreen may display an Unknown publisher warning.
          '@ | Set-Content -Path "desktop-dist\release-notes-v1.0.0.md" -Encoding utf8

      - name: Upload validated installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trebell-Code-Desktop-v1.0.0
          path: |
            trebell-code/desktop-dist/Trebell-Code-Setup-1.0.0.exe
            trebell-code/desktop-dist/Trebell-Code-Setup-1.0.0.exe.sha256
            trebell-code/desktop-dist/release-notes-v1.0.0.md
          if-no-files-found: error
          retention-days: 30

      - name: Ensure v1.0.0 git tag
        shell: pwsh
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $existing = git ls-remote --tags origin refs/tags/v1.0.0
          if (-not $existing) {
            git tag v1.0.0 "$env:GITHUB_SHA"
            git push origin v1.0.0
          }

      - name: Publish GitHub release
        id: publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.TREBELL_RELEASE_TOKEN || github.token }}
        working-directory: .
        run: |
          $installer = Resolve-Path "trebell-code\desktop-dist\Trebell-Code-Setup-1.0.0.exe"
          $checksum = Resolve-Path "trebell-code\desktop-dist\Trebell-Code-Setup-1.0.0.exe.sha256"
          $notes = Resolve-Path "trebell-code\desktop-dist\release-notes-v1.0.0.md"

          if (gh release view v1.0.0 *> $null) {
            gh release upload v1.0.0 $installer $checksum --clobber
          } else {
            gh release create v1.0.0 $installer $checksum --verify-tag --title "Trebell Code Desktop v1.0.0" --notes-file $notes
          }

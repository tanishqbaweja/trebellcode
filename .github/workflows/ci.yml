name: Trebell Code CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: trebell-code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run smoke:bridge
      - name: Build Trebell GUI
        run: npm run ui:build
      - name: Install Chromium for UI test
        run: npx playwright install --with-deps chromium
      - name: Test Trebell GUI in Chromium
        run: npm run ui:test
      - name: Upload GUI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trebell-code-ui
          path: trebell-code/ui/test-results/trebell-code-ui.png
          if-no-files-found: ignore
      - run: node ./bin/trebell.mjs --help
      - name: Verify Codex runtime is installed
        run: ./node_modules/.bin/codex --version
      - name: Doctor smoke test
        run: TREBELL_HOME="$RUNNER_TEMP/trebell" node ./bin/trebell.mjs doctor

name: Trebell Code CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Smoke-test vendored freebuff2api CLI
        run: npm run smoke:bridge
      - name: Smoke-test Trebell CLI
        run: |
          node ./bin/trebell.mjs --help
          TREBELL_HOME="$RUNNER_TEMP/trebell" node ./bin/trebell.mjs doctor || true

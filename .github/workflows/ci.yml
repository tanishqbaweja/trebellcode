name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit and integration tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # The runner's Git turns LF into CRLF on checkout; keep the files as the repository stores them.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf input
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      # The runner's own TEMP is a short 8.3 path (C:\Users\RUNNER~1\...), while git and Node give back the long form of the
      # same folder, so tests that compare paths of the repositories they make there would fail on the runner alone.
      - name: Run the unit and integration tests
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: npm test

  ui:
    name: UI build and bundle budgets
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf input
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build the interface
        run: npm run ui:build
      - name: Check the bundle budgets (B11)
        run: npm run test:budgets

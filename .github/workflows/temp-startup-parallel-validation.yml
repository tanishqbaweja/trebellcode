name: Temporary Native hot-path benchmarks
on:
  push:
    branches:
      - ci/startup-parallel-validation-20260928

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run bench:native:chat-message-cache
      - run: npm run bench:native:provider-history-projector
      - run: npm run bench:openai:prompt-cache-key-cache
      - run: npm run bench:openai:responses-input-build
      - run: npm run bench:native:tool-schema

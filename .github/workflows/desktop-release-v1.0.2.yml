name: Publish Trebell Code Desktop v1.0.2

on:
  push:
    paths:
      - "release-trigger-v1.0.2.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: trebell-code

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify package version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne "1.0.2") { throw "Expected package version 1.0.2, got $($pkg.version)" }

      - name: Install dependencies
        shell: pwsh
        run: |
          $attempts = 3
          for ($i = 1; $i -le $attempts; $i++) {
            Write-Host "npm install attempt $i/$attempts"
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq $attempts) { throw "npm install failed after $attempts attempts." }
            Start-Sleep -Seconds (5 * $i)
          }

      - name: Run full Trebell harness tests
        run: npm test

      - name: Build Freebuff bridge and Trebell UI
        run: |
          npm run bridge:build
          npm run ui:build

      - name: Build Windows NSIS installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Verify bundled Codex harness
        shell: pwsh
        run: |
          $codex = Get-ChildItem -Path "desktop-dist\win-unpacked\resources\app.asar.unpacked\node_modules\@openai\codex-win32-x64" -Filter codex.exe -Recurse | Select-Object -First 1
          if (-not $codex) { throw "Bundled Codex harness binary was not found." }
          & $codex.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Codex harness failed to execute." }

      - name: Install generated Trebell Code
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "desktop-dist" -Filter "Trebell-Code-Setup-1.0.2.exe" | Select-Object -First 1
          if (-not $installer) { throw "Trebell Code installer was not generated." }
          $proc = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Installer exited with code $($proc.ExitCode)" }

      - name: Launch and validate installed desktop application
        shell: pwsh
        run: |
          $installed = Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Filter "Trebell Code.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installed) { throw "Installed Trebell Code executable was not found." }

          $env:TREBELL_GUI_PORT = "3210"
          $env:TREBELL_APP_SERVER_PORT = "23456"
          $env:TREBELL_GUI_DEBUG = "1"
          $env:TREBELL_CDP_URL = "http://127.0.0.1:9333"

          $stdout = "$env:RUNNER_TEMP\trebell-installed.stdout.log"
          $stderr = "$env:RUNNER_TEMP\trebell-installed.stderr.log"
          $app = Start-Process -FilePath $installed.FullName -ArgumentList "--remote-debugging-port=9333" -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $app.Id | Set-Content "$env:RUNNER_TEMP\trebell-installed.pid"

          try {
            $ready = $false
            $lastBoot = $null
            for ($i = 0; $i -lt 160; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $boot = Invoke-RestMethod -Uri "http://127.0.0.1:3210/api/bootstrap" -TimeoutSec 2
                $lastBoot = $boot
                if ($boot.appServerReady -eq $true -and $boot.version -eq "1.0.2") {
                  $ready = $true
                  break
                }
              } catch {}
              if ($app.HasExited) { break }
            }

            if (-not $ready) {
              if ($lastBoot) { Write-Host "Last bootstrap: $($lastBoot | ConvertTo-Json -Depth 8 -Compress)" }
              throw "Installed Trebell Code never reached the expected ready state."
            }

            node tests/installed-relay-check.mjs http://127.0.0.1:3210
            if ($LASTEXITCODE -ne 0) { throw "Installed relay validation failed." }

            $payload = @{ name = "Release validation"; cols = 100; rows = 24 } | ConvertTo-Json
            $session = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:3210/api/terminal/sessions" -ContentType "application/json" -Body $payload -TimeoutSec 10
            if (-not $session.session.id -or $session.session.running -ne $true) { throw "PTY terminal did not start." }
            Invoke-RestMethod -Method Delete -Uri ("http://127.0.0.1:3210/api/terminal/sessions?id=" + [uri]::EscapeDataString($session.session.id)) -TimeoutSec 10 | Out-Null

            $runtime = Invoke-RestMethod -Uri "http://127.0.0.1:3210/api/runtime" -TimeoutSec 3
            if ($runtime.appServerReady -ne $true) { throw "Codex app-server is not ready." }

            $diagnostics = Invoke-RestMethod -Uri "http://127.0.0.1:3210/api/diagnostics" -TimeoutSec 5
            if ($diagnostics.version -ne "1.0.2") { throw "Diagnostics returned the wrong version: $($diagnostics.version)" }

            $health = Invoke-RestMethod -Uri "http://127.0.0.1:3210/api/health" -TimeoutSec 3
            if ($health.ok -ne $true) { throw "Trebell GUI health check failed." }

            node tests/installed-desktop-check.mjs
            if ($LASTEXITCODE -ne 0) { throw "Installed desktop/browser validation failed." }
          } catch {
            Write-Host "Installed process exited: $($app.HasExited)"
            if (Test-Path $stdout) { Write-Host "--- Trebell stdout ---"; Get-Content $stdout -Tail 300 }
            if (Test-Path $stderr) { Write-Host "--- Trebell stderr ---"; Get-Content $stderr -Tail 300 }
            throw
          }

      - name: Stop installed application
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:RUNNER_TEMP\trebell-installed.pid") {
            $pidValue = Get-Content "$env:RUNNER_TEMP\trebell-installed.pid" | Select-Object -First 1
            Stop-Process -Id $pidValue -Force -ErrorAction SilentlyContinue
          }
          Get-Process codex -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process "Trebell Code" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Create installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "desktop-dist" -Filter "Trebell-Code-Setup-1.0.2.exe" | Select-Object -First 1
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content -Path "desktop-dist\Trebell-Code-Setup-1.0.2.exe.sha256" -Encoding ascii
          Write-Host "SHA256: $hash"

      - name: Write release notes
        shell: pwsh
        run: |
          @'
          ## Trebell Code Desktop v1.0.2

          Hotfix release for AgentRouter 401 errors and real desktop Ctrl+mouse-wheel zoom.

          ### AgentRouter authentication
          - preserves the actual incoming Codex User-Agent through Trebell's loopback Responses bridge when calling AgentRouter
          - keeps the documented AgentRouter OpenAI-compatible base URL at https://co.agentrouter.org/v1
          - continues using Bearer authentication with the saved AgentRouter key
          - provider key normalization now strips accidental Bearer prefixes, BOMs and zero-width characters in addition to wrapping quotes/backticks
          - regression coverage verifies Codex identity survives /v1/responses -> /chat/completions
          - AgentRouter models continue to be loaded live from the authenticated /v1/models endpoint

          ### Desktop zoom
          - Ctrl + mouse-wheel up now triggers Electron's real zoom-changed path and enlarges the entire Trebell UI
          - Ctrl + mouse-wheel down zooms out
          - Ctrl + + / - / 0 continue to work
          - zoom remains persisted across restarts and clamped to the safe 70%-250% range
          - installed Windows validation performs a real Ctrl+wheel gesture and asserts the app zoom factor increases

          ### Validation
          - full Node harness/provider/bridge tests
          - Chromium UI E2E
          - Windows NSIS build, silent install and launch
          - bundled Codex app-server verification
          - installed AgentRouter bridge regression coverage
          - agent-browser, desktop-snapshot and Ctrl+wheel zoom checks
          - SHA-256 installer checksum

          This build is unsigned, so Windows SmartScreen may display an Unknown publisher warning.
          '@ | Set-Content -Path "desktop-dist\release-notes-v1.0.2.md" -Encoding utf8

      - name: Upload validated installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trebell-Code-Desktop-v1.0.2
          path: |
            trebell-code/desktop-dist/Trebell-Code-Setup-1.0.2.exe
            trebell-code/desktop-dist/Trebell-Code-Setup-1.0.2.exe.sha256
            trebell-code/desktop-dist/release-notes-v1.0.2.md
          if-no-files-found: error
          retention-days: 30

      - name: Ensure v1.0.2 git tag
        shell: pwsh
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $existing = git ls-remote --tags origin refs/tags/v1.0.2
          if (-not $existing) {
            git tag v1.0.2 "$env:GITHUB_SHA"
            git push origin v1.0.2
          }

      - name: Publish GitHub release
        id: publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.TREBELL_RELEASE_TOKEN || github.token }}
        working-directory: .
        run: |
          $installer = Resolve-Path "trebell-code\desktop-dist\Trebell-Code-Setup-1.0.2.exe"
          $checksum = Resolve-Path "trebell-code\desktop-dist\Trebell-Code-Setup-1.0.2.exe.sha256"
          $notes = Resolve-Path "trebell-code\desktop-dist\release-notes-v1.0.2.md"

          if (gh release view v1.0.2 *> $null) {
            gh release upload v1.0.2 $installer $checksum --clobber
          } else {
            gh release create v1.0.2 $installer $checksum --verify-tag --title "Trebell Code Desktop v1.0.2" --notes-file $notes
          }

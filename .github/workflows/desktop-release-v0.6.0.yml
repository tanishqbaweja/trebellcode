name: Publish Trebell Code Desktop v0.6.0

on:
  push:
    paths:
      - ".github/workflows/desktop-release-v0.6.0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: trebell-code

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run full Trebell harness tests
        run: npm test

      - name: Build Freebuff bridge and Trebell UI
        run: |
          npm run bridge:build
          npm run ui:build

      - name: Build Windows NSIS installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Verify bundled Codex harness
        shell: pwsh
        run: |
          $codex = Get-ChildItem -Path "desktop-dist\win-unpacked\resources\app.asar.unpacked\node_modules\@openai\codex-win32-x64" -Filter codex.exe -Recurse | Select-Object -First 1
          if (-not $codex) { throw "Bundled Codex harness binary was not found." }
          & $codex.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Codex harness failed to execute." }

      - name: Install generated Trebell Code
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "desktop-dist" -Filter "Trebell-Code-Setup-0.6.0.exe" | Select-Object -First 1
          if (-not $installer) { throw "Trebell Code installer was not generated." }
          $proc = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Installer exited with code $($proc.ExitCode)" }

      - name: Launch installed desktop application
        shell: pwsh
        run: |
          $installed = Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Filter "Trebell Code.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installed) { throw "Installed Trebell Code executable was not found." }

          $env:TREBELL_GUI_PORT = "3210"
          $env:TREBELL_APP_SERVER_PORT = "23456"
          $env:TREBELL_GUI_DEBUG = "1"

          $app = Start-Process -FilePath $installed.FullName -PassThru
          $app.Id | Set-Content "$env:RUNNER_TEMP\trebell-installed.pid"

          $ready = $false
          for ($i = 0; $i -lt 80; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              $boot = Invoke-RestMethod -Uri "http://127.0.0.1:3210/api/bootstrap" -TimeoutSec 2
              if ($boot.appServerReady -eq $true -and $boot.version -eq "0.6.0") {
                $ready = $true
                break
              }
            } catch {}
          }
          if (-not $ready) { throw "Installed Trebell Code never reached Codex app-server ready state." }

      - name: Verify installed Codex browser relay and command execution
        run: node tests/installed-relay-check.mjs http://127.0.0.1:3210

      - name: Verify installed PTY terminal
        shell: pwsh
        run: |
          $payload = @{ name = "Installer validation"; cols = 100; rows = 24 } | ConvertTo-Json
          $session = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:3210/api/terminal/sessions" -ContentType "application/json" -Body $payload -TimeoutSec 10
          if (-not $session.session.id) { throw "PTY terminal session was not created." }
          if ($session.session.running -ne $true) { throw "PTY terminal did not start." }
          Invoke-RestMethod -Method Delete -Uri ("http://127.0.0.1:3210/api/terminal/sessions?id=" + [uri]::EscapeDataString($session.session.id)) -TimeoutSec 10 | Out-Null

      - name: Verify installed project, diagnostics, and workspace APIs
        shell: pwsh
        run: |
          $runtime = Invoke-RestMethod -Uri "http://127.0.0.1:3210/api/runtime" -TimeoutSec 3
          if ($runtime.appServerReady -ne $true) { throw "Installed runtime reports Codex app-server not ready." }

          $tree = Invoke-RestMethod -Uri "http://127.0.0.1:3210/api/workspace/tree" -TimeoutSec 5
          if ($null -eq $tree.entries) { throw "Workspace tree endpoint is unavailable." }

          $diagnostics = Invoke-RestMethod -Uri "http://127.0.0.1:3210/api/diagnostics" -TimeoutSec 5
          if ($diagnostics.version -ne "0.6.0") { throw "Diagnostics returned the wrong version." }

          $health = Invoke-RestMethod -Uri "http://127.0.0.1:3210/api/health" -TimeoutSec 3
          if ($health.ok -ne $true) { throw "Trebell GUI health check failed." }

      - name: Stop installed application
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:RUNNER_TEMP\trebell-installed.pid") {
            $pidValue = Get-Content "$env:RUNNER_TEMP\trebell-installed.pid" | Select-Object -First 1
            Stop-Process -Id $pidValue -Force -ErrorAction SilentlyContinue
          }
          Get-Process codex -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Create installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "desktop-dist" -Filter "Trebell-Code-Setup-0.6.0.exe" | Select-Object -First 1
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content -Path "desktop-dist\Trebell-Code-Setup-0.6.0.exe.sha256" -Encoding ascii
          Write-Host "SHA256: $hash"

      - name: Write release notes
        shell: pwsh
        run: |
          @'
          ## Trebell Code Desktop v0.6.0

          v0.6.0 turns Trebell Code into a functional local desktop agent harness inspired by the interaction depth of T3 Code, while preserving Trebell's own UI and using **Freebuff for model inference**.

          ### Agent runtime
          - Codex app-server remains the local harness only.
          - Browser/Electron traffic reaches Codex through Trebell's localhost WebSocket relay.
          - Freebuff remains the model provider.
          - Direct Freebuff text fallback is retained if the harness is temporarily unavailable.

          ### Threads and agents
          - persistent threads and history
          - pin, reorder, snooze/wake, settle/unsettle and bulk actions
          - message search across threads
          - background/new-thread workflows
          - delegated/subagent inspector
          - multi-model Freebuff fan-out with separate Git worktrees

          ### Composer
          - Freebuff-only model selection with serving-agent metadata and Freebucks pricing
          - permission modes
          - current-workspace / new-worktree modes
          - attachments, drag/drop and pasted files
          - large pasted text becomes a context attachment
          - prompt recall and prompt stash
          - queued or steering follow-ups
          - skills and slash-command palette
          - context meter and compaction
          - assistant citations, terminal excerpts, PR context and diff-review context

          ### Workspace and terminal
          - persistent multi-tab PTY terminal
          - streamed input/output, Ctrl+C and bounded scrollback
          - reconnect to active terminals
          - workspace tree and file search
          - syntax-highlighted preview
          - edit/save files
          - real Git status/diff
          - reviewed-file state and review-comment context
          - Git-backed turn checkpoints and conversation/workspace revert

          ### Projects and source control
          - add local projects and clone repositories
          - grouped checkouts/worktrees
          - project model/permission/workspace overrides
          - branch switching and branch creation
          - fetch, fast-forward pull, push and safe auto-pull
          - commits and Freebuff-generated commit subjects
          - GitHub CLI diagnostics
          - create/list/inspect/comment/review/merge pull requests
          - thread-linked PRs
          - derived PR stacks with rebase-stack and merge-stack actions

          ### Freebuff product state
          - login/logout
          - Freebucks balance
          - active model/session
          - live or documented fallback hourly pricing
          - Freebuff serving-agent metadata
          - streak and daily bonus
          - rate limits and reset state
          - off-peak offers
          - server notices/offers/consent state when returned
          - active-turn heartbeat

          ### Desktop
          - themes and keyboard shortcuts
          - native completion/error/approval/input notifications
          - runtime diagnostics and logs
          - update checker
          - iframe browser preview
          - clean Codex, terminal-worker and Freebuff bridge shutdown

          ### Validation
          The release workflow installs this exact NSIS build on a clean Windows runner and verifies the installed application can:
          - start its bundled Codex app-server,
          - accept a browser-style WebSocket connection through the Trebell relay,
          - initialize Codex and list threads,
          - execute a real command through Codex,
          - create a real node-pty terminal session,
          - serve runtime, diagnostics, workspace and health APIs.

          Live Freebuff inference is not exercised in public CI because account credentials are intentionally not committed.

          This build is unsigned, so Windows SmartScreen may display an Unknown publisher warning.
          '@ | Set-Content -Path "desktop-dist\release-notes-v0.6.0.md" -Encoding utf8

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          $installer = Resolve-Path "trebell-code\desktop-dist\Trebell-Code-Setup-0.6.0.exe"
          $checksum = Resolve-Path "trebell-code\desktop-dist\Trebell-Code-Setup-0.6.0.exe.sha256"
          $notes = Resolve-Path "trebell-code\desktop-dist\release-notes-v0.6.0.md"

          if (gh release view v0.6.0 *> $null) {
            gh release upload v0.6.0 $installer $checksum --clobber
          } else {
            gh release create v0.6.0 $installer $checksum --target "$env:GITHUB_SHA" --title "Trebell Code Desktop v0.6.0" --notes-file $notes
          }

name: Publish Trebell Code Desktop v0.7.0

on:
  push:
    paths:
      - ".github/workflows/desktop-release-v0.7.0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: trebell-code

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run full Trebell harness tests
        run: npm test

      - name: Build Freebuff bridge and Trebell UI
        run: |
          npm run bridge:build
          npm run ui:build

      - name: Build Windows NSIS installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Verify bundled Codex harness
        shell: pwsh
        run: |
          $codex = Get-ChildItem -Path "desktop-dist\win-unpacked\resources\app.asar.unpacked\node_modules\@openai\codex-win32-x64" -Filter codex.exe -Recurse | Select-Object -First 1
          if (-not $codex) { throw "Bundled Codex harness binary was not found." }
          & $codex.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Codex harness failed to execute." }

      - name: Install generated Trebell Code
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "desktop-dist" -Filter "Trebell-Code-Setup-0.7.0.exe" | Select-Object -First 1
          if (-not $installer) { throw "Trebell Code installer was not generated." }
          $proc = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Installer exited with code $($proc.ExitCode)" }

      - name: Launch installed desktop application
        shell: pwsh
        run: |
          $installed = Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Filter "Trebell Code.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installed) { throw "Installed Trebell Code executable was not found." }

          $env:TREBELL_GUI_PORT = "3210"
          $env:TREBELL_APP_SERVER_PORT = "23456"
          $env:TREBELL_GUI_DEBUG = "1"

          $app = Start-Process -FilePath $installed.FullName -ArgumentList "--remote-debugging-port=9333" -PassThru
          $app.Id | Set-Content "$env:RUNNER_TEMP\trebell-installed.pid"

          $ready = $false
          for ($i = 0; $i -lt 100; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              $boot = Invoke-RestMethod -Uri "http://127.0.0.1:3210/api/bootstrap" -TimeoutSec 2
              if ($boot.appServerReady -eq $true -and $boot.version -eq "0.7.0") {
                $ready = $true
                break
              }
            } catch {}
          }
          if (-not $ready) { throw "Installed Trebell Code never reached Codex app-server ready state." }

      - name: Verify installed Codex browser relay and command execution
        run: node tests/installed-relay-check.mjs http://127.0.0.1:3210

      - name: Verify installed desktop browser, background, startup, notification, and voice surfaces
        env:
          TREBELL_CDP_URL: http://127.0.0.1:9333
        run: node tests/installed-desktop-check.mjs

      - name: Verify installed PTY terminal
        shell: pwsh
        run: |
          $payload = @{ name = "Installer validation"; cols = 100; rows = 24 } | ConvertTo-Json
          $session = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:3210/api/terminal/sessions" -ContentType "application/json" -Body $payload -TimeoutSec 10
          if (-not $session.session.id) { throw "PTY terminal session was not created." }
          if ($session.session.running -ne $true) { throw "PTY terminal did not start." }
          Invoke-RestMethod -Method Delete -Uri ("http://127.0.0.1:3210/api/terminal/sessions?id=" + [uri]::EscapeDataString($session.session.id)) -TimeoutSec 10 | Out-Null

      - name: Verify installed project, diagnostics, workspace, and health APIs
        shell: pwsh
        run: |
          $runtime = Invoke-RestMethod -Uri "http://127.0.0.1:3210/api/runtime" -TimeoutSec 3
          if ($runtime.appServerReady -ne $true) { throw "Installed runtime reports Codex app-server not ready." }

          $tree = Invoke-RestMethod -Uri "http://127.0.0.1:3210/api/workspace/tree" -TimeoutSec 5
          if ($null -eq $tree.entries) { throw "Workspace tree endpoint is unavailable." }

          $diagnostics = Invoke-RestMethod -Uri "http://127.0.0.1:3210/api/diagnostics" -TimeoutSec 5
          if ($diagnostics.version -ne "0.7.0") { throw "Diagnostics returned the wrong version." }

          $health = Invoke-RestMethod -Uri "http://127.0.0.1:3210/api/health" -TimeoutSec 3
          if ($health.ok -ne $true) { throw "Trebell GUI health check failed." }

      - name: Stop installed application
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:RUNNER_TEMP\trebell-installed.pid") {
            $pidValue = Get-Content "$env:RUNNER_TEMP\trebell-installed.pid" | Select-Object -First 1
            Stop-Process -Id $pidValue -Force -ErrorAction SilentlyContinue
          }
          Get-Process codex -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process "Trebell Code" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Create installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "desktop-dist" -Filter "Trebell-Code-Setup-0.7.0.exe" | Select-Object -First 1
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content -Path "desktop-dist\Trebell-Code-Setup-0.7.0.exe.sha256" -Encoding ascii
          Write-Host "SHA256: $hash"

      - name: Write release notes
        shell: pwsh
        run: |
          @'
          ## Trebell Code Desktop v0.7.0

          v0.7.0 extends the tested v0.6 desktop harness with a real agent-controlled browser and native desktop/background features.

          ### Agent browser
          - Electron-owned isolated browser session
          - `trebell_browser` dynamic tools for open, snapshot, click, type, and screenshot
          - addressable interactive page elements
          - Preview inspector for attaching browser element context
          - browser screenshots attachable to the agent

          ### Desktop
          - native completion, error, approval, and input notifications
          - system-tray/background operation
          - Windows startup registration while background mode is enabled
          - voice dictation when Chromium exposes SpeechRecognition
          - voice UI is disabled when SpeechRecognition is unavailable rather than simulating support

          ### Existing v0.6 harness
          v0.7.0 keeps the persistent threads, approvals, PTY terminals, workspace editing/search, Git diffs/checkpoints, worktrees, project defaults, Freebuff-only model selection/inference, GitHub pull-request workflows, and Freebuff account/session surfaces validated in v0.6.

          ### Installed-app validation
          The release workflow silently installs this exact NSIS build on a clean Windows runner and verifies:
          - bundled Codex executes and app-server reaches ready state
          - browser-origin WebSocket relay initializes Codex and executes a real command
          - real node-pty terminal starts and closes
          - workspace/runtime/diagnostics/health APIs work
          - packaged preload bridge is reachable
          - background mode toggles and Windows startup registration follows it
          - native notification IPC can be invoked
          - isolated agent browser can open a page, snapshot elements, type, click, and capture a PNG screenshot
          - voice dictation control truthfully reflects Chromium SpeechRecognition availability

          Live Freebuff inference is not exercised in public CI because account credentials are intentionally not committed.

          This build is unsigned, so Windows SmartScreen may display an Unknown publisher warning.
          '@ | Set-Content -Path "desktop-dist\release-notes-v0.7.0.md" -Encoding utf8

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          $installer = Resolve-Path "trebell-code\desktop-dist\Trebell-Code-Setup-0.7.0.exe"
          $checksum = Resolve-Path "trebell-code\desktop-dist\Trebell-Code-Setup-0.7.0.exe.sha256"
          $notes = Resolve-Path "trebell-code\desktop-dist\release-notes-v0.7.0.md"

          if (gh release view v0.7.0 *> $null) {
            gh release upload v0.7.0 $installer $checksum --clobber
          } else {
            gh release create v0.7.0 $installer $checksum --target "$env:GITHUB_SHA" --title "Trebell Code Desktop v0.7.0" --notes-file $notes
          }
